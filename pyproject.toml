[project]
name = "ai-comic-drama"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arkruntime==0.6.0",
    "colorama>=0.4.6",
    "langgraph==1.2.11",
    "langgraph-sdk==0.4.4",
    "pydantic==2.13.5",
    "pydantic-settings>=2.14.1",
    "langchain>=1.3.15",
    "deepagents>=0.7.8",
    "opensandbox>=1.1.0",
    "langfuse>=4.15.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai==1.4.1",
    "pillow==12.0.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "langgraph-cli[inmem]==0.4.31",
]
